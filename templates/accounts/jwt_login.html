{% load static %}
{% load django_bootstrap5 %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Task Management</title>
  <link rel="shortcut icon" type="image/png" href="{% static 'assets/images/logos/favicon.png' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/styles.min.css' %}" />
  {% bootstrap_css %}
  
  <style>
    .loading-btn {
      position: relative;
    }
    .loading-btn .spinner-border {
      width: 1rem;
      height: 1rem;
      border-width: 0.15rem;
    }
  </style>
</head>

<body>
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical"
       data-navbarbg="skin6" data-sidebartype="full"
       data-sidebar-position="fixed" data-header-position="fixed">

    <div class="position-relative overflow-hidden radial-gradient min-vh-100
                d-flex align-items-center justify-content-center">

      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
          <div class="col-md-8 col-lg-6 col-xxl-3">
            <div class="card mb-0 shadow-lg">
              <div class="card-body">
                <div class="text-nowrap logo-img text-center d-block py-3 w-100">
                  <i class="ti ti-clipboard-check text-primary me-2" style="font-size: 32px;"></i>
                  <div class="fw-bold text-dark" style="font-size: 18px;">Task Management System</div>
                </div>

                <p class="text-center mb-4 text-muted">Welcome back! Login to continue.</p>

                <!-- JWT Login Form -->
                <form id="jwtLoginForm" class="needs-validation" novalidate>
                  <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" 
                           placeholder="Enter username" required autocomplete="username">
                    <div class="invalid-feedback">Username is required</div>
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" 
                           placeholder="Enter password" required autocomplete="current-password">
                    <div class="invalid-feedback">Password is required</div>
                  </div>
                  
                  <div class="d-flex align-items-center justify-content-between mb-3">
                    <div class="form-check">
                      <input class="form-check-input primary" type="checkbox" id="rememberMe" checked>
                      <label class="form-check-label text-dark" for="rememberMe">Remember me</label>
                    </div>
                  </div>

                  <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fs-5 rounded-2">
                    <span id="btnText">
                      <i class="ti ti-login me-2"></i>Sign In
                    </span>
                    <span id="btnSpinner" class="d-none">
                      <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                      Signing in...
                    </span>
                  </button>
                </form>

                <div class="d-flex align-items-center justify-content-center mt-4">
                  <p class="fs-6 mb-0 fw-bold text-muted">Don't have an account?</p>
                  <a class="text-primary fw-bold ms-2" href="{% url 'accounts:register' %}">Register</a>
                </div>
              </div>
            </div>

            <p class="text-center mt-3 text-muted small">© 2025 Task Management System</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container (top-right) -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1055">
    <div id="loginToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="loginToastBody">
          <!-- Message injected here -->
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  {% bootstrap_javascript %}
  <script src="{% static 'assets/libs/jquery/dist/jquery.min.js' %}"></script>
  <script src="{% static 'assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>

  <script>
    // Constants
    const API_LOGIN_URL = '/accounts/login/';
    const DASHBOARD_URL = '/accounts/dashboard/';
    const TASKS_URL = '/tasks/tasks/';

    // Initialize toast
    let loginToast;

    document.addEventListener('DOMContentLoaded', () => {
      loginToast = new bootstrap.Toast(document.getElementById('loginToast'));
    });

    document.getElementById('jwtLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Check form validity
      const form = e.target;
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // Validate inputs
      if (!username || !password) {
        showToast('Please enter both username and password', 'danger');
        return;
      }

      // Show loading state
      setLoading(true);

      try {
        console.log('Sending login request...');
        
        const response = await fetch(API_LOGIN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        console.log('Login response:', data);

        if (!response.ok) {
          throw new Error(data.detail || data.error || data.message || 'Invalid credentials');
        }

        // Validate response structure
        if (!data.tokens || !data.tokens.access || !data.tokens.refresh) {
          throw new Error('Invalid response: missing tokens');
        }

        // Save tokens
        localStorage.setItem('access_token', data.tokens.access);
        localStorage.setItem('refresh_token', data.tokens.refresh);

        // Determine redirect URL based on user role
        const redirectUrl = data.user.is_superuser ? DASHBOARD_URL : TASKS_URL;
        console.log('Redirect URL:', redirectUrl);
        const userRole = data.user.is_superuser ? 'Admin' : 'User';

        // Show success message
        showToast(`Welcome ${userRole}! Redirecting...`, 'success');

        // Redirect after short delay
        setTimeout(() => {
          console.log(`Redirecting ${userRole} to ${redirectUrl}...`);
          window.location.href = redirectUrl;
        }, 1000);

      } catch (error) {
        console.error('Login error:', error);
        showToast(error.message || 'Login failed. Please try again.', 'danger');
        setLoading(false);
      }
    });

    // Set loading state
    function setLoading(isLoading) {
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      
      if (isLoading) {
        btn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');
      } else {
        btn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
      }
    }

    // Show toast function
    function showToast(message, type = 'info') {
      const toastEl = document.getElementById('loginToast');
      const toastBody = document.getElementById('loginToastBody');
      
      // Set message
      toastBody.textContent = message;
      
      // Set color based on type
      toastEl.className = 'toast align-items-center border-0';
      if (type === 'success') {
        toastEl.classList.add('text-bg-success');
      } else if (type === 'danger') {
        toastEl.classList.add('text-bg-danger');
      } else if (type === 'warning') {
        toastEl.classList.add('text-bg-warning');
      } else {
        toastEl.classList.add('text-bg-info');
      }
      
      loginToast.show();
    }
  </script>
</body>
</html>
