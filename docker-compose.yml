# ======================================================================
# Docker Compose configuration for Django User Management System
# ======================================================================
# Live deployment version (Render / production)
#
# - Only the Django `web` service is active.
# - Local Postgres and Adminer services are disabled.
# - Environment variables should point to Render’s managed Postgres DB.
# ======================================================================

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    # ------------------------------------------------------------------
    # Remove the "depends_on" entry because db service is disabled
    # ------------------------------------------------------------------
    # depends_on:
    #   - db
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE=postgres
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}

